# .github/workflows/update_master_links.yml

name: Generate and Deploy Master Links

on:
  push:
    branches:
      - main
  schedule:
    # 매주 월요일 자정(UTC)에 자동으로 실행 (한국 시간 오전 9시)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Actions 탭에서 수동으로 실행할 수 있는 버튼 추가

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate master_links.json
        env:
          SITE_LIST: ${{ secrets.SITE_LIST }}
          INFO_TEXTS: ${{ secrets.INFO_TEXTS }}
        run: python scripts/generate_master_links.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 'public' 폴더의 내용물을 배포합니다.
          publish_dir: ./public
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy latest master_links.json'

