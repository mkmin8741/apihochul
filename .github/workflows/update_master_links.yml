name: Generate and Deploy Master Links

on:
  push:
    branches:
      - main
  schedule:
    # 매주 월요일 자정(UTC)에 자동으로 실행 (한국 시간 오전 9시)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행을 위한 버튼 추가

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate master_links.json
        env:
          SITE_LIST: ${{ secrets.SITE_LIST }}
          INFO_TEXTS: ${{ secrets.INFO_TEXTS }}
        run: python scripts/generate_master_links.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # 아래 두 파일을 배포 브랜치에 포함시킵니다.
          publish_files: master_links.json
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy latest master_links.json'
