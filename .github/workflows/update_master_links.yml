# .github/workflows/update_master_links.yml
name: Generate Master Links File

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 자정(UTC)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate master_links.json
        env:
          SITE_LIST: ${{ secrets.SITE_LIST }}
          INFO_TEXTS: ${{ secrets.INFO_TEXTS }}
        run: python scripts/generate_master_links.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_links.json
          if ! git diff --staged --quiet; then
            git commit -m "Update master_links.json"
            git push
          else
            echo "No changes to commit"
          fi
